# Reverse proxy TLS (Let's Encrypt) para Freelancer.
# server_name www.danysolutions.online (sitio) y danysolutions.online (apex, solo
# redirige a www). No toca netospio ni otros subdominios.
# Frontend Docker: 127.0.0.1:9090
# El certificado /etc/letsencrypt/live/www.danysolutions.online cubre www + apex
# (setup-letsencrypt-freelancer.sh lo expande si aún no incluye el apex).

server {
    listen 80;
    listen [::]:80;
    server_name www.danysolutions.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.danysolutions.online;

    ssl_certificate     /etc/letsencrypt/live/www.danysolutions.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.danysolutions.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- Dominio raíz (apex) -> https://www.danysolutions.online ---
server {
    listen 80;
    listen [::]:80;
    server_name danysolutions.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://www.danysolutions.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name danysolutions.online;

    ssl_certificate     /etc/letsencrypt/live/www.danysolutions.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.danysolutions.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://www.danysolutions.online$request_uri;
}
