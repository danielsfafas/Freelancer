# Bootstrap HTTP-only para emitir certificado ACME (uso temporal).
# setup-letsencrypt-freelancer.sh lo reemplaza por nginx-host-freelancer.conf al terminar.
# Solo server_name www.danysolutions.online — no toca netospio-https.conf.

server {
    listen 80;
    listen [::]:80;
    server_name www.danysolutions.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
